<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE-edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi cumple</title>
    <link rel="stylesheet" href="estilo2.css">
</head>
<body>
    <div class="cont">
        <h1 class="info">
            ¡Presiona la Estrella!
        </h1>
        <div class="wrapp">
            <div class="envelope">
                <div class="letter">
                    <div class="text">
                        <strong title="07/10/2026">Mi cumpleaños</strong>
                        <p>
                            Hola! Quería invitarte a mi cumpleaños el día <strong>Sabado 10 de Octubre</strong> a las <strong>21:30 hrs</strong> 
                            en el salon Colonia. Me haria feliz que pudieras asistir!
                        </p>
                        <strong class="toque">Toca Acá ↓</strong>
                        <a class="map" href="https://www.google.com/maps/place/Club+Alem%C3%A1n/@-38.959803,-68.0168751,17z/data=!4m6!3m5!1s0x960a31bad0e44e53:0x6199f1ff25d4550b!8m2!3d-38.9598029!4d-68.0142991!16s%2Fg%2F11bwky9g2d?entry=ttu&g_ep=EgoyMDI2MDkyMy4wIKXMDSoASAFQAw%3D%3D" title="Ubicación">Figueroa 3750, Club Aleman</a>
                    </div>
                </div>
            </div>
            <div class="star"></div>
        </div>
    </div>
    <script>
        const envelope = document.querySelector('.wrapp');
        envelope.addEventListener('click', () => {
            envelope.classList.toggle('flap');
        });
    </script>
</body>
</html>
