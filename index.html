<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE-edge">
    <title>Mi cumple</title>
    <link rel="stylesheet" href="estilo2.css">
</head>
<body>
    <div class="cont">
        <div class="wrapp">
            <div class="envelope">
                <div class="letter">
                    <div class="text">
                        <strong>Mi cumpleaños</strong>
                        <p>
                            Queria decirte que estas felizmente invitado a mi cumpleañoss, 
                            ya que gracias a vos fuiste una parte querida de mi vida y queria
                            que no pierdas la oportunidad de venir hoy para cumplir mis 18 :].
                        </p>
                    </div>
                </div>
            </div>
            <div class="star"></div>
        </div>
    </div>
    <script>
        const envelope = document.querySelector('.wrapp');
        envelope.addEventListener('click', () => {
            envelope.classList.toggle('flap');
        });
    </script>
</body>
</html>
